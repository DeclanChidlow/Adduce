[package]
name = "adduce"
version = "0.2.0"
authors = ["Declan Chidlow <vale@vale.rocks>", "ToastXC <contact@toastxc.xyz>"]
edition = "2024"
rust-version = "1.85"
description = "A versatile, adaptable, and fast static site generator."
homepage = "https://adduce.vale.rocks"
repository = "https://github.com/DeclanChidlow/Adduce"
license = "LGPL-3.0-or-later"
keywords = ["cli", "generator", "static", "ssg", "site"]
categories = [
  "command-line-utilities",
  "web-programming",
  "parsing",
  "template-engine",
]

[dependencies]
serde = { version = "^1.0.229", features = ["derive"] }
toml = "^1.2.1"
pulldown-cmark = "^0.13.6"
atom_syndication = "^0.12.10"
chrono = "^0.4.45"
html-escape = "^0.3.1"
iri-string = "^0.7.14"
